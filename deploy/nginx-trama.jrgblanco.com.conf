# /etc/nginx/sites-available/trama.jrgblanco.com  (Certbot añade el bloque 443 y la redirección)
server {
    listen 80;
    server_name trama.jrgblanco.com;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3260;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;          # originales y vídeos en streaming con rangos
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
    }
}
