# Despliegue JRGB: offset +260 (Catálogo de Infraestructura). Solo 127.0.0.1; nginx + Certbot delante.
services:
  app:
    build: .
    container_name: trama-app
    restart: unless-stopped
    # Servidor compartido (2 núcleos): las vistas previas 4K no deben dejar sin CPU al resto.
    cpus: 1.0
    env_file: .env
    environment:
      TRAMA_DATA_DIR: /data
      TRAMA_HOST: 0.0.0.0
      TRAMA_PORT: "8765"
    ports:
      - "127.0.0.1:3260:8765"
    volumes:
      - trama-data:/data
      # Entrada de packs nuevos: se copian aquí, TRAMA los indexa y los sube a Drive; luego se borran.
      - ./entrada:/entrada
volumes:
  trama-data:
